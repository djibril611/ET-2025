<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Smart Door – Face Verify</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Idle attract loop -->
  <video id="idle-loop" autoplay loop muted playsinline>
    <source src="/videos/idle_loop.mp4" type="video/mp4"/>
  </video>

  <!-- Welcome clip -->
  <video id="welcome-video" class="hidden" playsinline></video>

  <!-- Verification overlay (now camera-fill) -->
  <div id="verify-layer" class="hidden">
      <img id="live-feed" src="/video_feed" alt="Live feed"/>
      <h1 id="status-text">Verifying…</h1>
  </div>

  <div id="hint">Press&nbsp;<span>any key</span>&nbsp;to verify</div>

  <script src="script.js"></script>
</body>
</html>
